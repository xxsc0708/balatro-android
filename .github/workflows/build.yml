name: Build Balatro Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android SDK
        id: sdk
        run: |
          set -x
          for p in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk" "/usr/local/lib/android/sdk"; do
            if [ -n "$p" ] && [ -d "$p" ]; then
              echo "FOUND_SDK=$p" >> "$GITHUB_OUTPUT"
              break
            fi
          done
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la /usr/local/lib/android/sdk 2>&1 || true
          which sdkmanager || true
          sdkmanager --version 2>&1 || true

      - name: Install SDK packages
        run: |
          set -x
          SDK="${{ steps.sdk.outputs.FOUND_SDK }}"
          echo "Using SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1" 2>&1
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>&1

      - name: Remove unused SDL example wrappers
        run: |
          rm -- app/src/main/cpp/megasource/libs/SDL2/android-project/gradle/wrapper/gradle-wrapper.jar \
            app/src/main/cpp/megasource/libs/SDL3/android-project/gradle/wrapper/gradle-wrapper.jar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Configure Gradle for CI
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          org.gradle.configureondemand=false
          android.useAndroidX=true
          android.enableJetifier=false
          android.nonTransitiveRClass=true
          EOF

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleEmbedNoRecordDebug --stacktrace --no-build-cache 2>&1

      - name: Verify APK contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apks = list(Path("app/build/outputs/apk/embedNoRecord/debug").glob("*.apk"))
          assert len(apks) == 1, f"Expected one APK, found {apks}"
          libraries = ["c++_shared", "SDL3", "oboe", "openal", "luajit", "liblove", "love"]
          required = {"assets/main.lua", "assets/conf.lua"}
          required.update(f"lib/arm64-v8a/lib{name}.so" for name in libraries)
          with ZipFile(apks[0]) as apk:
              missing = required - set(apk.namelist())
              assert not missing, f"Missing APK entries: {sorted(missing)}"
          print(f"Verified {apks[0]}: embedded game and all ARM64 runtime libraries present")
          PY

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: balatro-debug-apk
          path: app/build/outputs/apk/embedNoRecord/debug/*.apk
          retention-days: 30
          if-no-files-found: error
